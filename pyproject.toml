[project]
name = "xccfds"
version = "0.1.0"
description = "Explainable Credit Card Fraud Detection System: drift-aware SHAP, DiCE counterfactuals, audit logging"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "xgboost>=2.0",
  "shap>=0.45",
  "dice-ml>=0.11",
  "imbalanced-learn>=0.12",
  "scikit-learn>=1.4",
  "pandas>=2.0",
  "numpy>=1.26",
  "pyarrow>=15.0",
  "streamlit>=1.35",
  "plotly>=5.20",
  "joblib>=1.3",
  "matplotlib>=3.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]
